<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Drink Machine</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a0a00 0%, #3b1a0a 40%, #6b3f2a 100%);
      padding: 0 0 60px;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(90deg, #2d0a00 0%, #7c3a1e 50%, #2d0a00 100%);
      padding: 36px 24px 28px;
      text-align: center;
      border-bottom: 4px solid #e8a020;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f5d06e;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 24px rgba(232,160,32,0.4);
    }
    header p.tagline {
      margin-top: 6px;
      color: #d4a46a;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* ── Layout container ── */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ── Section headings ── */
    .section-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 20px;
      color: #f5d06e;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .section-heading::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, #e8a020 0%, transparent 100%);
      border-radius: 2px;
    }

    /* ── Toast message ── */
    #message {
      display: none;
      padding: 14px 20px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.3px;
      border-left: 6px solid;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      animation: slideIn 0.3s ease;
    }
    #message.message {
      display: block;
      background: #1a3a24;
      color: #6ee89a;
      border-color: #2ecc71;
    }
    #message.message.error {
      background: #3a1a1a;
      color: #ff7b7b;
      border-color: #e74c3c;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Drink cards grid ── */
    .drinks {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .drink-card {
      background: linear-gradient(160deg, #2e1206 0%, #1a0800 100%);
      border: 1px solid #6b3f2a;
      border-radius: 14px;
      padding: 22px 18px 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .drink-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(232,160,32,0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    .drink-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
      border-color: #e8a020;
    }

    .drink-card .drink-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .drink-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f5d06e;
      margin-bottom: 6px;
      letter-spacing: 0.4px;
    }
    .drink-card .cost {
      font-size: 1.1rem;
      font-weight: 800;
      color: #e8a020;
      margin-bottom: 14px;
    }

    .drink-card .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .drink-card .badge.available-badge {
      background: rgba(46,204,113,0.2);
      color: #2ecc71;
      border: 1px solid #2ecc71;
    }
    .drink-card .badge.unavailable-badge {
      background: rgba(231,76,60,0.15);
      color: #e74c3c;
      border: 1px solid #e74c3c;
    }

    .drink-card button {
      margin-top: auto;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    }
    .drink-card button.available {
      background: linear-gradient(90deg, #e8a020 0%, #f5c842 100%);
      color: #1a0800;
      box-shadow: 0 3px 10px rgba(232,160,32,0.4);
    }
    .drink-card button.available:hover {
      background: linear-gradient(90deg, #f5c842 0%, #e8a020 100%);
      transform: scale(1.03);
      box-shadow: 0 5px 16px rgba(232,160,32,0.55);
    }
    .drink-card button.available:active {
      transform: scale(0.98);
    }
    .drink-card button.unavailable {
      background: #2a1a12;
      color: #5a3a28;
      cursor: not-allowed;
      border: 1px solid #3a2218;
    }

    /* ── Ingredients grid ── */
    .ingredients {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }

    .ingredient {
      background: linear-gradient(135deg, #2e1206 0%, #1a0800 100%);
      border: 1px solid #6b3f2a;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .ingredient:hover {
      border-color: #e8a020;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .ingredient .name {
      color: #d4a46a;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .ingredient .stock {
      font-size: 1rem;
      font-weight: 800;
      min-width: 28px;
      text-align: center;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .ingredient .stock.stock-full   { background: rgba(46,204,113,0.2);  color: #2ecc71; }
    .ingredient .stock.stock-medium { background: rgba(243,156,18,0.2);  color: #f39c12; }
    .ingredient .stock.stock-low    { background: rgba(231,76,60,0.2);   color: #e74c3c; }
    .ingredient .stock.stock-empty  { background: rgba(100,100,100,0.2); color: #888;    }

    /* ── Restock button ── */
    #restock-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 13px 32px;
      background: linear-gradient(90deg, #1a6b3a 0%, #27ae60 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      box-shadow: 0 4px 16px rgba(39,174,96,0.4);
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }
    #restock-btn:hover {
      background: linear-gradient(90deg, #27ae60 0%, #2ecc71 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(39,174,96,0.55);
    }
    #restock-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <h1>☕ Coffee Drink Machine</h1>
    <p class="tagline">Select your brew &amp; enjoy</p>
  </header>

  <div class="container">
    <div id="message"></div>

    <h2 class="section-heading">🍵 Drinks</h2>
    <div id="drinks" class="drinks"></div>

    <h2 class="section-heading">🧪 Ingredients</h2>
    <div id="ingredients" class="ingredients"></div>

    <button id="restock-btn" onclick="restock()">🔄 Restock Ingredients</button>
  </div>

  <script>
    async function loadData() {
      const [drinksRes, ingredientsRes] = await Promise.all([
        fetch('/api/drinks'),
        fetch('/api/ingredients')
      ]);
      const drinks = await drinksRes.json();
      const ingredients = await ingredientsRes.json();
      renderDrinks(drinks);
      renderIngredients(ingredients);
    }

    const DRINK_ICONS = {
      'Coffee': '☕', 'Decaf Coffee': '🌙', 'Caffe Americano': '💧',
      'Caffe Latte': '🥛', 'Caffe Mocha': '🍫', 'Cappuccino': '☁️',
      'Espresso': '⚡', 'Macchiato': '🌰', 'Flat White': '🥛', 'Cortado': '🌰'
    };

    function drinkIcon(name) {
      return DRINK_ICONS[name] || '☕';
    }

    function renderDrinks(drinks) {
      const container = document.getElementById('drinks');
      container.innerHTML = drinks.map(d => `
        <div class="drink-card">
          <div class="drink-icon">${drinkIcon(d.name)}</div>
          <h3>${d.name}</h3>
          <div class="cost">$${d.cost.toFixed(2)}</div>
          <span class="badge ${d.makeable ? 'available-badge' : 'unavailable-badge'}">
            ${d.makeable ? '✓ Available' : '✗ Out of Stock'}
          </span>
          <button class="${d.makeable ? 'available' : 'unavailable'}"
            onclick="${d.makeable ? `makeDrink('${encodeURIComponent(d.name)}')` : ''}"
            ${d.makeable ? '' : 'disabled'}>
            ${d.makeable ? '☕ Order Now' : 'Out of Stock'}
          </button>
        </div>`).join('');
    }

    function stockClass(stock) {
      if (stock === 0) return 'stock-empty';
      if (stock <= 2) return 'stock-low';
      if (stock >= 3 && stock <= 5) return 'stock-medium';
      return 'stock-full';
    }

    function renderIngredients(ingredients) {
      const container = document.getElementById('ingredients');
      container.innerHTML = ingredients.map(i => `
        <div class="ingredient">
          <span class="name">${i.name}</span>
          <span class="stock ${stockClass(i.stock)}">${i.stock}</span>
        </div>`).join('');
    }

    function showMessage(text, isError) {
      const el = document.getElementById('message');
      el.className = 'message' + (isError ? ' error' : '');
      el.textContent = text;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; el.textContent = ''; }, 4000);
    }

    async function makeDrink(encodedName) {
      const res = await fetch(`/api/drinks/${encodedName}/make`, { method: 'POST' });
      const data = await res.json();
      showMessage(data.message, !res.ok);
      renderDrinks(data.drinks);
      renderIngredients(data.ingredients);
    }

    async function restock() {
      const res = await fetch('/api/restock', { method: 'POST' });
      const data = await res.json();
      showMessage(data.message, !res.ok);
      renderDrinks(data.drinks);
      renderIngredients(data.ingredients);
    }

    loadData();
  </script>
</body>
</html>
